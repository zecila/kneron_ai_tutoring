services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - LIVETALKING_BASE_URL=http://host.docker.internal:8010
      - MANIM_MCP_URL=http://manim-agent:8000/mcp/
      - MANIM_DOWNLOAD_URL=http://manim-agent:8000/download
      - REDIS_URL=redis://redis:6379
      - FLASK_ENV=${FLASK_ENV:-development}
    volumes:
      - ./backend/data:/app/backend/data
    depends_on:
      - redis
      - manim-agent
    restart: unless-stopped

  manim-agent:
    build: ./mcp_Manim_Agent/src
    ports:
      - "8000:8000"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  whisperlivekit:
    build:
      context: ${WHISPERLIVEKIT_PATH:-../WhisperLiveKit}
      dockerfile: Dockerfile.cpu
      args:
        EXTRAS: ${WHISPERLIVEKIT_EXTRAS:-cpu}
    image: kneron-whisperlivekit:cpu
    ports:
      - "${WHISPERLIVEKIT_PORT:-8002}:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    command:
      - --backend
      - ${WHISPER_BACKEND:-faster-whisper}
      - --model
      - ${WHISPER_MODEL:-base}
      - --language
      - ${WHISPER_LANGUAGE:-en}
      - --pcm-input
      - --pause-segmentation-seconds
      - ${WHISPER_PAUSE_SEGMENTATION_SECONDS:-1.0}
      - --cors-origins
      - ${WHISPER_CORS_ORIGINS:-http://127.0.0.1:5000,http://localhost:5000}
    volumes:
      - whisperlivekit-hf-cache:/root/.cache/huggingface/hub
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 10s
      start_period: 5m
      retries: 5
    restart: unless-stopped

volumes:
  whisperlivekit-hf-cache:
    name: whisperlivekit-hf-cache
